<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c9f3d5" />
    <meta name="description" content="Buildanta WE SCALE — an interactive growth-system experience." />
    <title>Buildanta — WE SCALE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main class="we-scale-share">
      <section class="we-scale-stage" aria-label="Buildanta WE SCALE interactive sequence">
        <canvas class="we-scale-canvas" aria-hidden="true"></canvas>

        <div class="we-scale-copy" aria-hidden="true">
          <span>WE</span>
          <strong>SCALE.</strong>
        </div>

        <div class="we-scale-capital" aria-hidden="true">
          <div>
            <span>CAPITAL STRATEGY</span><span>ACQUISITION</span><span>CONVERSION</span>
            <span>RETENTION</span><span>REVENUE INTELLIGENCE</span><span>CAPITAL STRATEGY</span>
            <span>ACQUISITION</span><span>CONVERSION</span><span>RETENTION</span>
            <span>REVENUE INTELLIGENCE</span>
          </div>
        </div>

        <div class="we-scale-hud" aria-hidden="true">
          <span>BUILDANTA / GROWTH SYSTEMS</span>
          <b>SCROLL TO ADVANCE</b>
        </div>

        <div class="we-scale-progress" aria-hidden="true"><i></i></div>
      </section>
      <div class="we-scale-scroll-space" aria-hidden="true"></div>
    </main>

    <script type="module" src="/src/we-scale-standalone.js"></script>
  </body>
</html>
